workflows:
  ios-release:
    name: iOS App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic New" 
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.azzmedia.elitetvplay
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.azzmedia.elitetvplay"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          # Timestamp build number (yymmddHHMM): always higher than any previous upload,
          # so App Store Connect never rejects it as a duplicate.
          NEW_BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "Setting build number to: $NEW_BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" ios/App/App/Info.plist
          cd ios/App
          agvtool new-version -all $NEW_BUILD_NUMBER || true
      - name: Build IPA
        script: |
          # Build without the extra flag (the project is now updated)
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true